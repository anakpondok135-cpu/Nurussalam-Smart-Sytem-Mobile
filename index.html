<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>K-Mob Nurussalam</title>

  <!-- MANIFEST & SERVICE WORKER LINK -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/18BXHst1ZLjMEz3ecdW6qkV-l0JjQeO-9">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/18BXHst1ZLjMEz3ecdW6qkV-l0JjQeO-9">

  <meta name="theme-color" content="#123524">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="K-Mob">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at center, #184731 0%, #0a1b13 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }
    .app-logo {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      border: 3px solid rgba(255, 215, 0, 0.4);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    .title { font-size: 1.4rem; font-weight: 700; margin: 0 0 5px 0; }
    .subtitle { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 25px; }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text { font-size: 0.8rem; color: #94a3b8; }
    .install-box {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 14px;
      margin-top: 25px;
      max-width: 320px;
      font-size: 0.75rem;
      color: #e2e8f0;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <img src="https://lh3.googleusercontent.com/d/18BXHst1ZLjMEz3ecdW6qkV-l0JjQeO-9" alt="Logo Nurussalam" class="app-logo">
  <h1 class="title">K-Mob Nurussalam</h1>
  <div class="subtitle">Sistem Digital Terpadu Kepesantrenan</div>

  <div class="spinner"></div>
  <div class="status-text" id="txtLoading">Memeriksa kesiapan aplikasi...</div>

  <div class="install-box" id="boxInstall">
    <b>📲 Pasang ke Layar Depan HP:</b><br>
    Ketuk titik tiga <b>(⋮)</b> di pojok kanan atas Chrome, lalu pilih <b>"Tambahkan ke Layar Utama" / "Instal Aplikasi"</b>.
  </div>

  <script>
    // Registrasi Service Worker sesuai panduan video
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Active'))
        .catch(err => console.log('SW Error:', err));
    }

    const URL_GAS = "https://script.google.com/macros/s/AKfycbxqLxVwSD3ad_k7WI1CfF1pT3GgsrORFHcv_IPb4WnoQm0SaeFmaFhPCGo9s9o1kHN_/exec";

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    if (isStandalone) {
      document.getElementById("boxInstall").style.display = "none";
      document.getElementById("txtLoading").innerText = "Menghubungkan ke server K-Mob...";
      setTimeout(function() {
        window.location.replace(URL_GAS);
      }, 700);
    } else {
      setTimeout(function() {
        window.location.replace(URL_GAS);
      }, 3000);
    }
  </script>
</body>
</html>
